services:
  opensync:
    image: ghcr.io/piskevalee-cpu/opensync:latest
    ports:
      - "3000:3000"
    volumes:
      - opensync-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opensync-data: