[package]
name = "launcher-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opensync-launcher"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono.workspace = true
launcher-core = { path = "../launcher-core" }
launcher-db = { path = "../launcher-db" }
opensync-api = { path = "../opensync-api" }
opensync-discord = { path = "../opensync-discord" }
opensync-proton = { path = "../opensync-proton" }
opensync-runner = { path = "../opensync-runner" }
opensync-sync = { path = "../opensync-sync" }
opensync-transfer = { path = "../opensync-transfer" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
