id: io.opensync.launcher
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: opensync-launcher

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --allow=multiarch
  - --allow=per-app-dev-shm
  - --filesystem=home
  - --filesystem=xdg-run/app/com.valvesoftware.Steam:create
  - --talk-name=org.freedesktop.Notifications
  # Discord Rich Presence connects to Discord over $XDG_RUNTIME_DIR/discord-ipc-*.
  - --filesystem=xdg-run/discord-ipc-0
  # Needed by the Flatpak host-launch fallback (flatpak-spawn --host): Proton/Wine
  # needs a complete runtime (notably 32-bit libs) that the GNOME 49 sandbox lacks.
  - --talk-name=org.freedesktop.Flatpak
  # GNOME 49 no longer provides its own i386 compat extension, so expose the
  # freedesktop one explicitly and let the loader find the installed 32-bit libs.
  - --env=LD_LIBRARY_PATH=/app/lib/i386-linux-gnu
  # GNOME 49's WebKitGTK DMA-BUF compositor causes glitched/stuttering
  # section-switch animations inside the Flatpak sandbox.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

# Do not use `inherit-extensions` here: it copies extension points from the parent
# runtime's metadata, and org.gnome.Platform 49 no longer declares the i386/GL32
# points (flatpak-builder then fails with "Can't find inherited extension point
# org.freedesktop.Platform.Compat.i386"). Defining the points with `add-extensions`
# below is the supported way to attach the freedesktop compat extensions to an app.
add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '25.08'
  org.freedesktop.Platform.Compat.i386.Debug:
    directory: lib/debug/lib/i386-linux-gnu
    version: '25.08'
    no-autodownload: true
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: '1.4'
    versions: '25.08;1.4'
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib

cleanup-commands:
  - mkdir -p /app/lib/i386-linux-gnu
  - ln -sfn /app/lib/i386-linux-gnu /app/lib32

modules:
  - name: opensync-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 opensync-launcher /app/bin/opensync-launcher
      - install -Dm644 io.opensync.launcher.desktop /app/share/applications/io.opensync.launcher.desktop
      - install -Dm644 io.opensync.launcher.metainfo.xml /app/share/metainfo/io.opensync.launcher.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.opensync.launcher.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.opensync.launcher.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/io.opensync.launcher.png
      - install -Dm644 icon-32.png /app/share/icons/hicolor/32x32/apps/io.opensync.launcher.png
    sources:
      - type: file
        path: opensync-launcher
      - type: file
        path: io.opensync.launcher.desktop
      - type: file
        path: io.opensync.launcher.metainfo.xml
      - type: file
        path: ../../crates/launcher-tauri/icons/icon.png
        dest-filename: icon-512.png
      - type: file
        path: ../../crates/launcher-tauri/icons/128x128@2x.png
        dest-filename: icon-256.png
      - type: file
        path: ../../crates/launcher-tauri/icons/128x128.png
        dest-filename: icon-128.png
      - type: file
        path: ../../crates/launcher-tauri/icons/32x32.png
        dest-filename: icon-32.png
