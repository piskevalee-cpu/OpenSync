[workspace]
resolver = "2"
members = [
    "crates/launcher-db",
    "crates/opensync-api",
    "crates/opensync-transfer",
    "crates/opensync-sync",
    "crates/opensync-proton",
    "crates/opensync-runner",
    "crates/launcher-core",
    "crates/launcher-tauri",
]
default-members = [
    "crates/launcher-db",
    "crates/opensync-api",
    "crates/opensync-transfer",
    "crates/opensync-sync",
    "crates/opensync-proton",
    "crates/opensync-runner",
    "crates/launcher-core",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/piskevalee-cpu/OpenSync"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
flate2 = "1.1"
futures-util = "0.3"
hex = "0.4"
itoa = "1.0"
memchr = "2.8"
parking_lot = "0.12"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.12", features = ["v4"] }
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
